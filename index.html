<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Mock Chat | EMONXPLOIT</title>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- html2canvas for downloading the chat as an image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        /* Control Panel Styles */
        .controls {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .controls h2 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: #333;
        }

        input, button {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 1rem;
        }

        button {
            background-color: #128C7E;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #075E54;
        }

        .btn-download {
            background-color: #25D366;
            margin-top: 10px;
        }

        .btn-download:hover {
            background-color: #1ebe5d;
        }

        /* WhatsApp Chat Preview Styles */
        .chat-container {
            width: 350px;
            background: #e5ddd5;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* WhatsApp Header */
        .chat-header {
            background-color: #075E54;
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            background: #ccc;
        }

        .header-info {
            flex: 1;
        }

        .header-info h3 {
            margin: 0;
            font-size: 1rem;
        }

        .header-info p {
            margin: 0;
            font-size: 0.8rem;
            color: #d1d1d1;
        }

        .header-icons i {
            margin-left: 15px;
            font-size: 1.1rem;
        }

        /* Chat Area */
        .chat-box {
            padding: 20px 15px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            /* Background Pattern */
            background-image: url('https://i.ibb.co/3s1f17G/wa-bg.png');
            background-size: cover;
        }

        .msg {
            max-width: 75%;
            padding: 8px 10px;
            border-radius: 7px;
            position: relative;
            font-size: 0.95rem;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg .time {
            font-size: 0.65rem;
            color: #888;
            float: right;
            margin: 10px 0 -5px 10px;
        }

        .msg.sent {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-top-right-radius: 0;
        }

        .msg.received {
            align-self: flex-start;
            background-color: white;
            border-top-left-radius: 0;
        }

        /* Credit */
        .credit {
            text-align: center;
            width: 100%;
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Control Panel -->
    <div class="controls">
        <h2>🛠️ প্রোফাইল ও মেসেজ এডিট</h2>
        
        <label>প্রোফাইল ছবি (DP):</label>
        <input type="file" id="dpInput" accept="image/*">
        
        <label>নাম / নাম্বার:</label>
        <input type="text" id="nameInput" value="Emon Islam" oninput="updateProfile()">
        
        <label>স্ট্যাটাস:</label>
        <input type="text" id="statusInput" value="online" oninput="updateProfile()">

        <hr style="width: 100%; border: 0.5px solid #eee;">

        <label>নতুন মেসেজ লিখুন:</label>
        <input type="text" id="msgText" placeholder="Hi, how are you?">
        <input type="time" id="msgTime" value="10:30">
        
        <button onclick="addMessage('received')"><i class="fas fa-arrow-down"></i> অন্যজনের মেসেজ (White)</button>
        <button onclick="addMessage('sent')"><i class="fas fa-arrow-up"></i> আমার মেসেজ (Green)</button>
        
        <button class="btn-download" onclick="downloadChat()"><i class="fas fa-download"></i> ছবি হিসেবে ডাউনলোড করুন</button>
    </div>

    <!-- WhatsApp Preview -->
    <div class="chat-container" id="captureArea">
        <!-- Header -->
        <div class="chat-header">
            <i class="fas fa-arrow-left"></i>
            <img id="dpPreview" src="https://via.placeholder.com/40" alt="DP">
            <div class="header-info">
                <h3 id="displayName">Emon Islam</h3>
                <p id="displayStatus">online</p>
            </div>
            <div class="header-icons">
                <i class="fas fa-video"></i>
                <i class="fas fa-phone"></i>
                <i class="fas fa-ellipsis-v"></i>
            </div>
        </div>

        <!-- Chat Area -->
        <div class="chat-box" id="chatBox">
            <div class="msg received">
                হ্যালো! প্রজেক্টের কাজ কতদূর? <span class="time">10:00 AM</span>
            </div>
            <div class="msg sent">
                প্রায় শেষের দিকে! <span class="time">10:05 AM <i class="fas fa-check-double" style="color: #4fc3f7;"></i></span>
            </div>
        </div>
    </div>

    <div class="credit">
        Developed by <strong>EMONXPLOIT</strong>
    </div>

    <script>
        // Update Name & Status dynamically
        function updateProfile() {
            document.getElementById('displayName').innerText = document.getElementById('nameInput').value;
            document.getElementById('displayStatus').innerText = document.getElementById('statusInput').value;
        }

        // Handle DP Image Upload
        document.getElementById('dpInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('dpPreview').src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Format 24h time to 12h AM/PM
        function formatAMPM(time24) {
            let [hours, minutes] = time24.split(':');
            let ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            return hours + ':' + minutes + ' ' + ampm;
        }

        // Add Message to Chat Box
        function addMessage(type) {
            const text = document.getElementById('msgText').value;
            const timeRaw = document.getElementById('msgTime').value;
            
            if (text.trim() === '') return;

            const timeFormatted = timeRaw ? formatAMPM(timeRaw) : '';
            const tick = type === 'sent' ? ' <i class="fas fa-check-double" style="color: #4fc3f7;"></i>' : '';

            const msgDiv = document.createElement('div');
            msgDiv.className = `msg ${type}`;
            msgDiv.innerHTML = `${text} <span class="time">${timeFormatted}${tick}</span>`;

            const chatBox = document.getElementById('chatBox');
            chatBox.appendChild(msgDiv);
            
            // Scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
            
            // Clear input
            document.getElementById('msgText').value = '';
        }

        // Download Chat as Image using html2canvas
        function downloadChat() {
            const captureArea = document.getElementById('captureArea');
            
            // Temporarily hide scrollbar for a clean screenshot
            const chatBox = document.getElementById('chatBox');
            chatBox.style.overflow = 'hidden';

            html2canvas(captureArea, {
                scale: 2, // High resolution
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                // Restore scrollbar
                chatBox.style.overflow = 'auto';

                // Create download link
                const link = document.createElement('a');
                link.download = 'MockChat_by_EMONXPLOIT.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>

</body>
</html>
