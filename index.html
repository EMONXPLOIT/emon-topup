<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Screenshot Editor | EMONXPLOIT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: #2c3e50;
            color: #ecf0f1;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Tools */
        .sidebar {
            width: 320px;
            background: #1a252f;
            padding: 20px;
            box-shadow: 2px 0 15px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
            overflow-y: auto;
        }

        .sidebar h2 { margin: 0; color: #3498db; text-align: center; font-size: 22px; }
        
        .tool-box {
            background: #2c3e50;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
        }
        
        .tool-box h3 { margin: 0 0 10px 0; font-size: 14px; color: #bdc3c7; }

        input[type="file"], input[type="color"], input[type="range"] { width: 100%; cursor: pointer; }
        
        .btn {
            width: 100%; padding: 10px; margin-top: 10px;
            background: #3498db; color: white; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; font-size: 14px;
            display: flex; justify-content: center; align-items: center; gap: 8px;
        }
        .btn:hover { background: #2980b9; }
        .btn-green { background: #2ecc71; }
        .btn-green:hover { background: #27ae60; }
        .btn-red { background: #e74c3c; }
        .btn-red:hover { background: #c0392b; }

        /* Workspace */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #34495e;
            overflow: auto;
            position: relative;
            padding: 20px;
        }

        #editor-wrapper {
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            background: #fff;
        }

        canvas {
            display: block;
            cursor: crosshair;
        }

        /* Editable Text Block */
        .editable-text {
            position: absolute;
            min-width: 50px;
            min-height: 20px;
            border: 1px dashed #3498db;
            padding: 2px 5px;
            cursor: move;
            background: transparent;
            outline: none;
            white-space: pre-wrap;
            z-index: 20;
        }
        .editable-text:focus { border: 1px solid #e74c3c; }

    </style>
</head>
<body>

    <div class="sidebar">
        <h2><i class="fas fa-edit"></i> Pro SS Editor</h2>

        <!-- Step 1: Upload -->
        <div class="tool-box">
            <h3>১. স্ক্রিনশট আপলোড করুন</h3>
            <input type="file" id="uploadImg" accept="image/*">
        </div>

        <!-- Step 2: Eraser Tool -->
        <div class="tool-box">
            <h3>২. পুরোনো লেখা মুছুন (Brush)</h3>
            <label style="font-size: 12px; color: #aaa;">ব্যাকগ্রাউন্ডের সাথে মিলিয়ে রঙ বাছুন:</label>
            <input type="color" id="brushColor" value="#ffffff">
            <br><br>
            <label style="font-size: 12px; color: #aaa;">ব্রাশের সাইজ:</label>
            <input type="range" id="brushSize" min="5" max="50" value="15">
            
            <button class="btn btn-red" onclick="clearCanvas()" style="margin-top: 15px;">
                <i class="fas fa-undo"></i> ছবি রিসেট করুন
            </button>
        </div>

        <!-- Step 3: Add Text -->
        <div class="tool-box">
            <h3>৩. নতুন লেখা বসান</h3>
            <div style="display: flex; gap: 10px;">
                <div style="flex:1;">
                    <label style="font-size: 12px;">লেখার রঙ:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div style="flex:1;">
                    <label style="font-size: 12px;">সাইজ:</label>
                    <input type="number" id="textSize" value="16" style="width:100%; padding: 5px;">
                </div>
            </div>
            <button class="btn" onclick="addTextElement()">
                <i class="fas fa-font"></i> নতুন টেক্সট যোগ করুন
            </button>
            <p style="font-size: 11px; color:#bdc3c7; margin-top:10px;">* টেক্সটটি মাউস দিয়ে টেনে সঠিক জায়গায় বসান এবং ক্লিক করে লেখা এডিট করুন।</p>
        </div>

        <!-- Step 4: Download -->
        <button class="btn btn-green" onclick="downloadImage()" style="margin-top: auto; font-size: 16px; padding: 15px;">
            <i class="fas fa-download"></i> স্ক্রিনশট সেভ করুন
        </button>
    </div>

    <div class="workspace" id="workspace">
        <div id="editor-wrapper">
            <canvas id="canvas"></canvas>
            <!-- Text elements will be injected here -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('editor-wrapper');
        let currentImage = null;

        // Drawing Variables
        let isDrawing = false;
        let brushColor = '#ffffff';
        let brushSize = 15;

        // Tool Elements
        document.getElementById('brushColor').addEventListener('input', (e) => brushColor = e.target.value);
        document.getElementById('brushSize').addEventListener('input', (e) => brushSize = e.target.value);

        // 1. Upload Image to Canvas
        document.getElementById('uploadImg').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        currentImage = img;
                        setupCanvas(img);
                    }
                    img.src = event.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // Setup Canvas Size & Draw Image
        function setupCanvas(img) {
            canvas.width = img.width;
            canvas.height = img.height;
            // Scale down via CSS if image is too large, but keep original resolution
            canvas.style.maxWidth = "100%";
            canvas.style.height = "auto";
            
            ctx.drawImage(img, 0, 0);
            
            // Remove old texts if any
            document.querySelectorAll('.editable-text').forEach(e => e.remove());
        }

        // Reset Canvas
        function clearCanvas() {
            if (currentImage) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(currentImage, 0, 0);
            }
        }

        // 2. Painting Logic (To erase old text)
        canvas.addEventListener('mousedown', () => isDrawing = true);
        canvas.addEventListener('mouseup', () => { isDrawing = false; ctx.beginPath(); });
        canvas.addEventListener('mousemove', draw);

        function draw(e) {
            if (!isDrawing || !currentImage) return;

            // Get exact mouse position relative to canvas original resolution
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const x = (e.clientX - rect.left) * scaleX;
            const y = (e.clientY - rect.top) * scaleY;

            ctx.lineWidth = brushSize;
            ctx.lineCap = 'round';
            ctx.strokeStyle = brushColor;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // 3. Add Editable Text Logic
        function addTextElement() {
            if (!currentImage) { alert("প্রথমে স্ক্রিনশট আপলোড করুন!"); return; }

            const color = document.getElementById('textColor').value;
            const size = document.getElementById('textSize').value;

            const textDiv = document.createElement('div');
            textDiv.className = 'editable-text';
            textDiv.contentEditable = true;
            textDiv.innerText = "এখানে লিখুন";
            textDiv.style.color = color;
            
            // Adjust size based on canvas scale to make it look right
            const rect = canvas.getBoundingClientRect();
            const scaleRatio = rect.width / canvas.width;
            textDiv.style.fontSize = (size * scaleRatio) + 'px';
            textDiv.style.fontFamily = 'Arial, sans-serif'; // Generic font, edit as needed
            
            textDiv.style.top = '50px';
            textDiv.style.left = '50px';

            // Dragging logic for text
            let isDragging = false, startX, startY;
            
            textDiv.addEventListener('mousedown', (e) => {
                if(document.activeElement !== textDiv) {
                    isDragging = true;
                    startX = e.clientX - textDiv.offsetLeft;
                    startY = e.clientY - textDiv.offsetTop;
                }
            });
            document.addEventListener('mouseup', () => isDragging = false);
            document.addEventListener('mousemove', (e) => {
                if (isDragging) {
                    textDiv.style.left = (e.clientX - startX) + 'px';
                    textDiv.style.top = (e.clientY - startY) + 'px';
                }
            });

            wrapper.appendChild(textDiv);
            textDiv.focus();
        }

        // 4. Download Processed Screenshot
        function downloadImage() {
            if (!currentImage) { alert("কোনো ছবি নেই!"); return; }

            // Hide dashed borders before screenshot
            document.querySelectorAll('.editable-text').forEach(e => {
                e.style.border = 'none';
            });

            html2canvas(wrapper, {
                scale: 2, // High resolution output
                useCORS: true,
                backgroundColor: null
            }).then(canvasOutput => {
                const link = document.createElement('a');
                link.download = 'Pro_Edited_Screenshot.jpg';
                link.href = canvasOutput.toDataURL('image/jpeg', 0.95);
                link.click();
                
                // Restore borders for further editing
                document.querySelectorAll('.editable-text').forEach(e => {
                    e.style.border = '1px dashed #3498db';
                });
            });
        }
    </script>
</body>
</html>
