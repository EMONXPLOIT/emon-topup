<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Screenshot Text Editor | EMONXPLOIT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #1e1e2e;
            color: white;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        /* Left Toolbar */
        .toolbar {
            width: 300px;
            background: #282a36;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .toolbar h2 {
            margin: 0;
            color: #50fa7b;
            font-size: 1.2rem;
            text-align: center;
        }

        .tool-group {
            background: #44475a;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input[type="file"], input[type="text"], input[type="color"], input[type="number"] {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            background: #6272a4;
            color: white;
            box-sizing: border-box;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background: #bd93f9;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #ff79c6;
        }

        .btn-success {
            background: #50fa7b;
            color: #282a36;
        }
        .btn-success:hover {
            background: #5af182;
        }

        /* Canvas Area (Right side) */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #191a21;
            padding: 20px;
            overflow: auto;
        }

        #editor-container {
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            /* Default white background if no image is loaded */
            background: #fff; 
        }

        #bg-image {
            display: block;
            max-width: 100%;
            max-height: 85vh;
            pointer-events: none; /* Prevents dragging the image itself */
        }

        /* Draggable Text Elements */
        .draggable-text {
            position: absolute;
            top: 50px;
            left: 50px;
            cursor: move;
            padding: 2px 5px;
            border: 1px dashed transparent;
            user-select: none;
            white-space: pre-wrap; /* Allows multi-line text */
        }

        .draggable-text:hover, .draggable-text.active {
            border: 1px dashed #ff79c6;
            background: rgba(255, 255, 255, 0.1);
        }

        .delete-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #ff5555;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .draggable-text.active .delete-btn {
            display: flex;
        }

    </style>
</head>
<body>

    <!-- Left Controls -->
    <div class="toolbar">
        <h2><i class="fas fa-magic"></i> SS Image Editor</h2>
        
        <div class="tool-group">
            <label>১. স্ক্রিনশট আপলোড করুন:</label>
            <input type="file" id="imageLoader" accept="image/*">
        </div>

        <div class="tool-group">
            <label>২. নতুন টেক্সট যোগ করুন:</label>
            <input type="text" id="textInput" placeholder="যেকোনো লেখা দিন...">
            
            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>রঙ:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>
                <div style="flex: 1;">
                    <label>সাইজ:</label>
                    <input type="number" id="textSize" value="16" min="8" max="100">
                </div>
            </div>
            
            <button onclick="addText()"><i class="fas fa-plus"></i> টেক্সট যোগ করুন</button>
        </div>

        <div class="tool-group">
            <label style="font-size: 0.9rem; color: #f1fa8c;">
                💡 <b>কিভাবে কাজ করবেন:</b><br>
                ১. অরিজিনাল ছবির লেখার ওপর নতুন টেক্সট বসান।<br>
                ২. মাউস দিয়ে টেনে সঠিক জায়গায় রাখুন।<br>
                ৩. প্রয়োজন হলে ব্যাকগ্রাউন্ড কালার দিয়ে পুরোনো লেখা ঢেকে দিন।
            </label>
        </div>

        <button class="btn-success" onclick="downloadEditedImage()" style="margin-top: auto;">
            <i class="fas fa-download"></i> এডিটেড ছবি ডাউনলোড
        </button>
    </div>

    <!-- Right Workspace -->
    <div class="workspace">
        <div id="editor-container">
            <img id="bg-image" src="" style="display: none;" alt="Uploaded Screenshot">
            <!-- Draggable elements will be added here -->
        </div>
    </div>

    <script>
        const imageLoader = document.getElementById('imageLoader');
        const bgImage = document.getElementById('bg-image');
        const editorContainer = document.getElementById('editor-container');
        let activeElement = null;

        // 1. Image Upload Handler
        imageLoader.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    bgImage.src = event.target.result;
                    bgImage.style.display = 'block';
                    
                    // Clear previous texts if a new image is loaded
                    document.querySelectorAll('.draggable-text').forEach(el => el.remove());
                }
                reader.readAsDataURL(file);
            }
        });

        // Paste Image from Clipboard
        window.addEventListener('paste', e => {
            const items = e.clipboardData.items;
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    const blob = items[i].getAsFile();
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        bgImage.src = event.target.result;
                        bgImage.style.display = 'block';
                    };
                    reader.readAsDataURL(blob);
                }
            }
        });

        // 2. Add Text to Canvas
        function addText() {
            if(!bgImage.src) {
                alert("প্রথমে একটি স্ক্রিনশট আপলোড বা পেস্ট করুন!");
                return;
            }

            const textVal = document.getElementById('textInput').value;
            const colorVal = document.getElementById('textColor').value;
            const sizeVal = document.getElementById('textSize').value;

            if(!textVal) return;

            const textDiv = document.createElement('div');
            textDiv.className = 'draggable-text';
            textDiv.style.color = colorVal;
            textDiv.style.fontSize = sizeVal + 'px';
            textDiv.innerText = textVal;

            // Optional: Background to hide old text. Using a slight solid background matching common themes.
            // If the user is editing a white theme WhatsApp, the background can be white.
            // You can add a color picker for background later if needed.
            textDiv.style.backgroundColor = '#ffffff'; // Default cover color (white)

            // Add Delete Button
            const delBtn = document.createElement('div');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '<i class="fas fa-times"></i>';
            delBtn.onclick = function() { textDiv.remove(); };
            textDiv.appendChild(delBtn);

            // Make it draggable
            makeDraggable(textDiv);
            
            editorContainer.appendChild(textDiv);
            document.getElementById('textInput').value = ''; // clear input
        }

        // 3. Drag and Drop Logic
        function makeDraggable(elmnt) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

            elmnt.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                e.preventDefault();
                // Get mouse position at startup
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                // Set active styling
                if(activeElement) activeElement.classList.remove('active');
                activeElement = elmnt;
                elmnt.classList.add('active');
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                // Calculate new position
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                // Set element's new position
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                // Stop moving when mouse button is released
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        // Deselect element when clicking outside
        editorContainer.addEventListener('mousedown', function(e) {
            if(e.target === editorContainer || e.target === bgImage) {
                if(activeElement) {
                    activeElement.classList.remove('active');
                    activeElement = null;
                }
            }
        });

        // 4. Download Final Edited Image
        function downloadEditedImage() {
            if(!bgImage.src) {
                alert("কোনো ছবি পাওয়া যায়নি!");
                return;
            }

            // Remove active borders before taking screenshot
            if(activeElement) activeElement.classList.remove('active');

            html2canvas(editorContainer, {
                scale: 2, // High resolution
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Edited_Screenshot_EMONXPLOIT.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        }
    </script>
</body>
</html>
