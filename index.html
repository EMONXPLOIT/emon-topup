<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atomic Progress | Emon Islam</title>
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Modern Dark Theme CSS */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeIn 1s ease-in-out;
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .subtitle {
            font-size: 1rem;
            color: #94a3b8;
            font-style: italic;
        }

        .app-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Progress Bar */
        .progress-container {
            width: 100%;
            background: #334155;
            border-radius: 10px;
            margin-bottom: 25px;
            height: 12px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Input Section */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            background: var(--accent-color);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* Habit List */
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #334155;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        li.completed {
            opacity: 0.6;
            text-decoration: line-through;
            border-left: 4px solid var(--accent-color);
        }

        .habit-text {
            flex: 1;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .delete-btn {
            background: var(--danger);
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        /* Footer / Developer Section */
        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
        }

        .dev-profile {
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 30px;
            display: inline-block;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .dev-profile p {
            margin: 5px 0;
            color: #94a3b8;
        }

        .dev-profile strong {
            color: white;
            letter-spacing: 1px;
        }

        .social-link {
            display: inline-block;
            margin-top: 10px;
            color: var(--accent-color);
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .social-link:hover {
            color: #60a5fa;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>Emon Islam</h1>
        <div class="subtitle">"1% Better Every Day"</div>
    </header>
    
    <div class="app-container">
        <!-- Dynamic Progress Bar -->
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>

        <!-- Add Habit Input -->
        <div class="input-group">
            <input type="text" id="habitInput" placeholder="আজকের নতুন লক্ষ্য যোগ করুন...">
            <button onclick="addHabit()"><i class="fas fa-plus"></i></button>
        </div>

        <!-- Habits List -->
        <ul id="habitList">
            <!-- Habits will be added here by JS -->
        </ul>
    </div>

    <footer>
        <div class="dev-profile">
            <p>Developed with <i class="fas fa-code" style="color: var(--accent-color);"></i> by <strong>EMONXPLOIT</strong></p>
            <!-- আপনার ফেসবুক আইডির লিংক 'href' এর ভিতরে বসিয়ে দিন -->
            <a href="https://facebook.com/your-profile-link" target="_blank" class="social-link">
                <i class="fab fa-facebook fa-lg"></i> Connect with Developer
            </a>
        </div>
    </footer>

    <script>
        const input = document.getElementById('habitInput');
        const list = document.getElementById('habitList');
        const progress = document.getElementById('progress');
        
        // এখানে কিছু ডেমো ডেটা দেওয়া হলো
        let habits = [
            { text: "Python প্র্যাকটিস করা", done: false },
            { text: "বই পড়া (১০ পৃষ্ঠা)", done: true }
        ];

        function updateProgress() {
            if(habits.length === 0) { 
                progress.style.width = '0%'; 
                return; 
            }
            const completed = habits.filter(h => h.done).length;
            const percent = (completed / habits.length) * 100;
            progress.style.width = percent + '%';
        }

        function render() {
            list.innerHTML = '';
            habits.forEach((h, i) => {
                const li = document.createElement('li');
                if(h.done) li.classList.add('completed');
                
                li.innerHTML = `
                    <span class="habit-text" onclick="toggleHabit(${i})">
                        <i class="${h.done ? 'fas fa-check-circle' : 'far fa-circle'}"></i> 
                        &nbsp; ${h.text}
                    </span>
                    <button class="delete-btn" onclick="removeHabit(${i})">
                        <i class="fas fa-trash"></i>
                    </button>
                `;
                list.appendChild(li);
            });
            updateProgress();
        }

        function addHabit() {
            const val = input.value.trim();
            if(val === '') return;
            habits.push({ text: val, done: false });
            input.value = '';
            render();
        }

        // Enter বাটন চাপলে যাতে কাজ করে
        input.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                addHabit();
            }
        });

        function toggleHabit(index) {
            habits[index].done = !habits[index].done;
            render();
        }

        function removeHabit(index) {
            habits.splice(index, 1);
            render();
        }

        // শুরুতে একবার লোড করার জন্য
        render();
    </script>

</body>
</html>
